{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure Payment | MH Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static '/images/logo.png' %}" rel="icon">
    
    <!-- Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-main: #ffffff;
            --bg-muted: #f9f9f9;
            --text-main: #111111;
            --text-muted: #767676;
            --border-color: #eeeeee;
            --radius-lg: 24px;
            --radius-pill: 50px;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-muted);
            -webkit-font-smoothing: antialiased;
        }

        .payment-card {
            background: var(--bg-main);
            width: 90%;
            max-width: 440px;
            padding: 40px 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--text-main);
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .warning {
            background: var(--bg-muted);
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 1.5rem;
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }

        .cancel-button {
            margin-top: 1.5rem;
            padding: 12px;
            width: 100%;
            background: transparent;
            color: #d9534f;
            border: 1px solid #d9534f;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .cancel-button:hover {
            background: #d9534f;
            color: #fff;
        }

        .secure-text {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <div class="payment-card">
        <div class="logo">MH Club</div>
        <div class="subtitle">Secure Razorpay Checkout</div>

        <div class="loader"></div>

        <h3>Redirecting you to payment gateway...</h3>

        <div class="warning">
            <i class="bi bi-exclamation-triangle me-1"></i> Please do not refresh or close this page while payment is processing.
        </div>

        <button id="cancel-button" class="cancel-button">
            Cancel Payment
        </button>

        <div class="secure-text">
            🔒 100% Secure Transaction via Razorpay
        </div>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        var options = {
            "key": "{{ key_id }}",
            "currency": "INR",
            "name": "MH Club",
            "logo": "http://127.0.0.1:8000/static/images/logo.png",
            "description": "Order Payment",
            "order_id": "{{ order_id }}",
            "method": {
                upi: true,
                card: true,
                netbanking: true,
                wallet: true
            },
            "handler": function (response) {
                 fetch("/handlerequest/", {
                     method: "POST",
                     headers: {
                         "Content-Type": "application/json",
                     },
                     body: JSON.stringify(response)
                 }).then(res => res.json())
                     .then(data => {
                         if (data.status === "success") {
                             window.location.href =
                                 "/paymentstatus/?status=success&razorpay_order_id=" +
                                 response.razorpay_order_id +
                                 "&razorpay_payment_id=" +
                                 response.razorpay_payment_id;
                         } else {
                             alert("Payment verification failed");
                         }
                     });
            },

            "modal": {
                "ondismiss": function () {
                    window.location.href =
                        "/paymentstatus/?status=canceled&razorpay_order_id={{ order_id }}";
                }
            },

            "prefill": {
            },

            "theme": {
                "color": "#111111"
            }
        };
        
        var rzp1 = new Razorpay(options);

        function openRazorpay() {
            rzp1.open();
        }

        // Automatically trigger Razorpay modal on load
        openRazorpay();

        document.getElementById("cancel-button").addEventListener("click", function () {
            window.location.href =
                "/paymentstatus/?status=canceled&razorpay_order_id={{ order_id }}";
        });
    </script>

</body>

</html>
