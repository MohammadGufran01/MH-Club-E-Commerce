{% extends 'base.html' %} 
{% block title %}Reset Password | MH Club{% endblock title %} 

{% block content %}
<style>
  :root {
    --bg-main: #ffffff;
    --bg-muted: #f9f9f9;
    --text-main: #111111;
    --text-muted: #767676;
    --border-color: #eeeeee;
    --radius-pill: 50px;
  }

  body {
    background-color: var(--bg-main);
  }

  .auth-wrapper {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .auth-container {
    width: 100%;
    max-width: 420px;
    background: var(--bg-main);
    padding: 2rem 0;
  }

  .auth-title {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-main);
    margin-bottom: 0.5rem;
    text-align: center;
  }

  .auth-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 2.5rem;
  }

  .form-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-main);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
  }

  .form-control {
    border: 1px solid var(--border-color);
    background-color: var(--bg-muted);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: all 0.2s ease;
    margin-bottom: 1.5rem;
  }

  .form-control:focus {
    background-color: var(--bg-main);
    border-color: var(--text-main);
    box-shadow: none;
  }

  .btn-submit-pill {
    background-color: var(--text-main);
    color: var(--bg-main);
    border-radius: var(--radius-pill);
    padding: 1rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border: 1px solid var(--text-main);
    width: 100%;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    margin-top: 1rem;
  }

  .btn-submit-pill:hover:not(:disabled) {
    background-color: var(--bg-main);
    color: var(--text-main);
  }

  .auth-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .auth-footer a {
    color: var(--text-main);
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-container">
    
    <!-- Alerts -->
    {% for message in messages %}
    <div class="alert alert-{{message.tags}} alert-dismissible fade show text-uppercase text-center mb-4" style="background-color: #111; color: #fff; border-radius: 50px; border: none; letter-spacing: 1px; font-size: 0.8rem; padding: 10px 30px;" role="alert">
      <strong>{{message}}</strong>
      <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.7rem;"></button>
    </div>
    {% endfor %}

    <h3 class="auth-title" data-aos="fade-up">Reset Password</h3>
    <p class="auth-subtitle" data-aos="fade-up" data-aos-delay="50">Enter your email to receive a reset link.</p>

    <form action="/auth/request-reset-email/" method="post" id="reset-form" data-aos="fade-up" data-aos-delay="100">
      {% csrf_token %}
      
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
      
      <button id="submit-btn" type="submit" class="btn-submit-pill">Send Reset Link</button>
      <button style="display:none;" id="btn-loading" class="btn-submit-pill" type="button" disabled>
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Submitting...
      </button>

      <div class="auth-footer">
        <a href="/">Go Back to Home</a>
      </div>
    </form>

  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    let form = document.getElementById("reset-form");
    let submitBtn = document.getElementById("submit-btn");
    let loadingBtn = document.getElementById("btn-loading");

    submitBtn.addEventListener("click", function (e) {
      if (form.checkValidity()) {
        submitBtn.style.display = "none";
        loadingBtn.style.display = "inline-block";
      }
    });
  });
</script>
{% endblock content %}
