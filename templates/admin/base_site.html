{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}

<!-- Google Fonts (Outfit & Inter) and Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

<!-- ApexCharts Engine CDN -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<style>
/* ===== Sleek Top Progress Bar Loader ===== */
#admin-top-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0%;
  height: 3px;
  background: linear-gradient(90deg, #6366f1, #a855f7, #10b981);
  z-index: 999999;
  transition: width 0.3s ease, opacity 0.3s ease;
  pointer-events: none;
  opacity: 0;
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.7);
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const progressBar = document.createElement("div");
  progressBar.id = "admin-top-progress";
  document.body.appendChild(progressBar);

  function startProgress() {
    progressBar.style.opacity = "1";
    progressBar.style.width = "40%";
    setTimeout(() => {
      if (progressBar.style.opacity === "1") progressBar.style.width = "75%";
    }, 200);
  }

  function finishProgress() {
    progressBar.style.width = "100%";
    setTimeout(() => {
      progressBar.style.opacity = "0";
      setTimeout(() => { progressBar.style.width = "0%"; }, 300);
    }, 150);
  }

  window.addEventListener("load", finishProgress);
  window.addEventListener("pageshow", finishProgress);

  /* Trigger progress bar on form submits */
  document.querySelectorAll("form").forEach(form => {
    form.addEventListener("submit", () => {
      startProgress();
    });
  });
});
</script>

{% endblock %}
