{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH Club | 404 - Page Not Found</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Inter Font (Premium Editorial Look) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #ffffff;
      --text-main: #111111;
      --text-muted: #767676;
    }

    body {
      background-color: var(--bg-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .error-container {
      padding: 40px 20px;
      max-width: 600px;
      width: 100%;
    }

    .error-image {
      width: 100%;
      max-width: 280px;
      margin-bottom: 2rem;
      border-radius: 16px;
      object-fit: cover;
    }

    h1 {
      font-size: 8rem;
      font-weight: 700;
      letter-spacing: -4px;
      margin-bottom: 0;
      line-height: 1;
      color: var(--text-main);
    }

    h2 {
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }

    .btn-home {
      background-color: var(--text-main);
      color: var(--bg-main);
      border-radius: 50px;
      padding: 14px 36px;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid var(--text-main);
      display: inline-block;
    }

    .btn-home:hover {
      background-color: transparent;
      color: var(--text-main);
    }

    .footer-text {
      margin-top: 5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 6rem; }
      .error-image { max-width: 220px; }
    }
  </style>
</head>
<body>
  
  <div class="error-container">
    
    <!-- Using your exact backend static image link -->
    <img src="{% static 'images/404.jpg' %}" alt="404 Error" class="error-image" onerror="this.style.display='none'">
    
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn’t exist or has been moved.</p>
    
    <a href="/" class="btn-home">
      Return to Store
    </a>
    
    <div class="footer-text">
      © {{ now|date:"Y" }} <strong>MH Club</strong>. All rights reserved.
    </div>

  </div>

</body>
</html>
