{% extends "base.html" %}

{% block title %}
  Sign Up | MH Club
{% endblock title %}

{% block content %}
<style>
  :root {
    --bg-main: #ffffff;
    --bg-muted: #f9f9f9;
    --text-main: #111111;
    --text-muted: #767676;
    --border-color: #eeeeee;
    --radius-pill: 50px;
  }

  body {
    background-color: var(--bg-main);
  }

  .auth-wrapper {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .auth-container {
    width: 100%;
    max-width: 420px;
    background: var(--bg-main);
    padding: 2rem 0;
  }

  .auth-title {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-main);
    margin-bottom: 0.5rem;
    text-align: center;
  }

  .auth-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 2.5rem;
  }

  .form-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-main);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
  }

  .form-control {
    border: 1px solid var(--border-color);
    background-color: var(--bg-muted);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: all 0.2s ease;
    margin-bottom: 1.5rem;
  }

  .form-control:focus {
    background-color: var(--bg-main);
    border-color: var(--text-main);
    box-shadow: none;
  }

  .btn-submit-pill {
    background-color: var(--text-main);
    color: var(--bg-main);
    border-radius: var(--radius-pill);
    padding: 1rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border: 1px solid var(--text-main);
    width: 100%;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    margin-top: 1rem;
  }

  .btn-submit-pill:hover:not(:disabled) {
    background-color: var(--bg-main);
    color: var(--text-main);
  }

  .auth-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .auth-footer a {
    color: var(--text-main);
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-container">
    
    <!-- Alerts -->
    {% for message in messages %}
    <div class="alert alert-{{message.tags}} alert-dismissible fade show text-uppercase text-center mb-4" style="background-color: #111; color: #fff; border-radius: 50px; border: none; letter-spacing: 1px; font-size: 0.8rem; padding: 10px 30px;" role="alert">
      <strong>{{message}}</strong>
      <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="alert" aria-label="close" style="font-size: 0.7rem;"></button>
    </div>
    {% endfor %}

    <h3 class="auth-title" data-aos="fade-up">Create Account</h3>
    <p class="auth-subtitle" data-aos="fade-up" data-aos-delay="50">Join MH Club to shop the latest collections.</p>

    <form action="/auth/signup/" method="post" id="signup-form" data-aos="fade-up" data-aos-delay="100">
      {% csrf_token %}
      
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
      
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
      
      <label for="pass1" class="form-label">Password</label>
      <input type="password" class="form-control" id="pass1" name="pass1" required placeholder="••••••••">
      
      <label for="pass2" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="pass2" name="pass2" required placeholder="••••••••">
      
      <button id="submit-btn" type="submit" class="btn-submit-pill">Sign Up</button>
      <button style="display:none;" id="btn-loading" class="btn-submit-pill" type="button" disabled>
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Creating Account...
      </button>

      <div class="auth-footer">
        Already have an account? <a href="/auth/login/">Log in here</a>
      </div>
    </form>

  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    /* =========================
       SUBMIT BUTTON LOGIC
    ========================== */
    let form = document.getElementById("signup-form");
    let submitBtn = document.getElementById("submit-btn");
    let loadingBtn = document.getElementById("btn-loading");

    submitBtn.addEventListener("click", function (e) {
      if (form.checkValidity()) {
        submitBtn.style.display = "none";
        loadingBtn.style.display = "inline-block";
      }
    });

    /* =========================
       CART INITIALIZATION (GLOBAL)
    ========================== */
    let cart = localStorage.getItem("cart") ? JSON.parse(localStorage.getItem("cart")) : {};
    const cartCount = document.getElementById("cart");
    const popcart = document.getElementById("popcart");

    let popover = null;
    if(popcart) {
      popover = new bootstrap.Popover(popcart, {
        html: true,
        trigger: "button",
        sanitize: false, 
        placement: "bottom",
        content: "Your bag is empty"
      });
    }

    updateCart(cart);

    /* =========================
       UPDATE CART UI
    ========================== */
    function updateCart(cart) {
      let totalQty = 0;
      for (let item in cart) {
        totalQty += cart[item][0];
      }
      if(cartCount) cartCount.innerText = totalQty;
    }

    /* =========================
       UPDATE POPOVER
    ========================== */
    function updatePopover() {
      if(!popover) return;

      let html = `<h6 class="mb-3 fw-bold" style="color: #111;">Your Bag</h6><div class="mb-3">`;
      let i = 1;
      let hasItems = false;

      for (let item in cart) {
        if (cart[item][0] > 0) {
          hasItems = true;
          html += `<div style="font-size: 0.85rem; color: #767676; margin-bottom: 8px;">
            <span class="fw-bold text-dark">${i}.</span> ${cart[item][1].slice(0, 20)} 
            <span class="float-end fw-bold text-dark">x${cart[item][0]}</span>
          </div>`;
          i++;
        }
      }

      if (!hasItems) {
        popover.hide();
        return;
      }

      html += `
        </div>
        <div class="d-flex gap-2 mt-3 pt-3 border-top">
          <a href="/checkout/?itemsJson=${encodeURIComponent(JSON.stringify(cart))}" class="btn w-100 fw-bold" style="background-color: #111; color: #fff; border-radius: 50px; font-size: 0.8rem; padding: 10px 0;">Checkout</a>
          <button class="btn fw-bold" style="background-color: #f5f5f5; color: #111; border-radius: 50px; font-size: 0.8rem; padding: 10px 15px;" onclick="clearCart()">Clear</button>
        </div>
      `;

      popover.setContent({ ".popover-body": html });
      popover.show();
    }

    /* =========================
       CLEAR CART (GLOBAL)
    ========================== */
    window.clearCart = function () {
      cart = {};
      localStorage.removeItem("cart");
      if(cartCount) cartCount.innerText = "0";
      if(popover) popover.hide();
    };

  });
</script>
{% endblock content %}
