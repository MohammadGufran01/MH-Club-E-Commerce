{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | MH Club Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; font-size: 1.1rem;">
        MH Club <span style="font-weight: 300; font-size: 0.85rem; opacity: 0.8;">Administration</span>
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-bg: #ffffff;
        --secondary-bg: #f8f9fa;
        --border-color: #e5e5e5;
        --text-main: #111111;
        --text-muted: #666666;
        --accent-dark: #000000;
    }

    body {
        font-family: 'Inter', sans-serif !important;
        background-color: var(--secondary-bg) !important;
        color: var(--text-main) !important;
    }

    #container {
        background: var(--primary-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.03);
        margin: 20px auto;
        overflow: hidden;
    }

    #header {
        background: var(--accent-dark) !important;
        color: #ffffff !important;
        padding: 15px 30px !important;
        border-bottom: none;
    }

    #header a:link, #header a:visited {
        color: #ffffff;
    }

    #user-tools {
        font-size: 0.85rem;
        letter-spacing: 0.5px;
    }

    .breadcrumbs {
        background: var(--primary-bg) !important;
        border-bottom: 1px solid var(--border-color);
        padding: 12px 30px !important;
        color: var(--text-muted) !important;
        font-size: 0.85rem;
    }

    .breadcrumbs a {
        color: var(--text-main);
    }

    /* Modules & Tables */
    .module {
        border: 1px solid var(--border-color) !important;
        border-radius: 8px !important;
        background: var(--primary-bg) !important;
        box-shadow: none !important;
        margin-bottom: 25px !important;
    }

    .module caption {
        background: #fafafa !important;
        color: var(--text-main) !important;
        font-weight: 600 !important;
        border-bottom: 1px solid var(--border-color);
        padding: 12px 16px !important;
        font-size: 0.95rem;
        letter-spacing: -0.2px;
    }

    table {
        border-collapse: separate !important;
        border-spacing: 0;
    }

    th {
        background-color: #fafafa !important;
        color: var(--text-main) !important;
        font-weight: 600 !important;
        font-size: 0.8rem !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border-color) !important;
        padding: 12px 10px !important;
    }

    td {
        border-bottom: 1px solid var(--border-color) !important;
        color: var(--text-main) !important;
        font-size: 0.9rem !important;
        padding: 12px 10px !important;
    }

    tr:hover td {
        background-color: #fcfcfc !important;
    }

    /* Buttons & Actions */
    .button, input[type=submit], input[type=button], .submit-row input {
        background: var(--accent-dark) !important;
        color: #ffffff !important;
        border-radius: 50px !important;
        padding: 8px 20px !important;
        border: 1px solid var(--accent-dark) !important;
        font-weight: 500 !important;
        font-size: 0.85rem !important;
        box-shadow: none !important;
        transition: all 0.2s ease;
    }

    .button:hover, input[type=submit]:hover {
        background: #333333 !important;
    }

    .button.default, input[type=submit].default {
        background: var(--accent-dark) !important;
    }

    /* Pagination */
    .paginator {
        border-top: 1px solid var(--border-color);
        background: #fafafa;
        padding: 12px;
    }

    .paginator a:link, .paginator a:visited {
        background: var(--primary-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-main);
        padding: 4px 10px;
    }

    .paginator .this-page {
        background: var(--accent-dark);
        color: white;
        border-radius: 6px;
        padding: 4px 10px;
    }
</style>
{% endblock %}
